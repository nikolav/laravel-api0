services:
  api:
    #build>           docker compose build api
    #build:log>       docker compose build api > build-log.docker.txt 2>&1
    #build:quiet>     docker compose build -q api
    #build:quiet:log> docker compose build -q api > build-log.docker.txt 2>&1
    #build:fresh>     docker compose build --pull api
    #build:clean>     docker compose build --pull --no-cache api
    #push>            docker compose push api
    image: 0imbn7v6rkw/laravel-api0

    build:
      context: .
      dockerfile: Dockerfile

    container_name: laravel-api
    ports:
      - "127.0.0.1:9000:9000"

    env_file:
      - ./.env
    environment:
      APP_ENV: production
      APP_DEBUG: "true"
      LOG_CHANNEL: stderr
      LOG_LEVEL: info

      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      CACHE_ARTISAN: "false"
      CLEAR_CACHES_ON_BOOT: "true"
      RUN_QUEUE: "true"
      QUEUE_WORK_QUEUES: "high,broadcasts,default,low"
      RUN_SCHEDULER: "true"

    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -fsS -H "Internal-Auth: $NGINX_INTERNAL_AUTH_TOKEN" http://127.0.0.1:9000/api/health || exit 1
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

