server {
  listen 80;
  server_name _;

  # sane defaults
  server_tokens         off;
  client_max_body_size  20m;
  keepalive_timeout     15s;

  # basic security api-safe headers
  add_header X-Content-Type-Options "nosniff"     always;
  add_header X-Frame-Options        "DENY"        always;
  add_header Referrer-Policy        "no-referrer" always;
  # add hsts if later migrate to https

  # ----------------------------------
  # internal upstream, nginx + laravel
  # ----------------------------------
  set $upstream "http://127.0.0.1:9000";

  # --------------------------
  # nginx self health endpoint
  # --------------------------
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # --------------------------
  # oauth relay/callback pages
  # --------------------------
  # GET|HEAD @/oauth/; cache:off;
  location ^~ /oauth/ {
    # allow GET/HEAD for oauth relay pages
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # no request bodies needed here (keeps things tight)
    client_max_body_size 0;

    # no cache; oauth relay/callback pages
    add_header Cache-Control "no-store" always;
    add_header Pragma        "no-cache" always;

    # tight csp for a relay page (allows inline script for postMessage + close)
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; style-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    # mute coop warnings for oauth popup flows
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # optional: reduce sensitive query logging
    access_log off;

    proxy_pass $upstream;
    proxy_http_version 1.1;

    # preserve client + scheme info
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # avoid httpoxy vulnerability
    proxy_set_header Proxy "";

    # connection handling (websocket-safe, harmless if unused)
    # proxy_set_header Upgrade    $http_upgrade;
    # proxy_set_header Connection "upgrade";
    proxy_set_header Connection "";

    # send internal auth token
    proxy_set_header Internal-Auth $internal_auth_token;

    # timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # buffering
    proxy_buffering off;
  }

  # --------------------
  # main api entrypoint
  # --------------------
  location ^~ /api/ {
    proxy_pass $upstream;
    proxy_http_version 1.1;

    # preserve client + scheme info
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # avoid httpoxy vulnerability
    proxy_set_header Proxy "";

    # connection handling (websocket-safe, harmless if unused)
    # proxy_set_header Upgrade    $http_upgrade;
    # proxy_set_header Connection "upgrade";
    proxy_set_header Connection "";

    # send internal auth token
    proxy_set_header Internal-Auth $internal_auth_token;

    # timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # buffering
    proxy_buffering off;
  }

  # ------------------------------
  # deny everything else, optional
  # ------------------------------
  # location / {
  #   return 404;
  # }
}
