map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream nginx9000 {
  server 127.0.0.1:9000;
  keepalive 32;
}

server {
  listen 443 ssl http2; # managed by Certbot
  server_name iqthedltpshzqnbiegqlkh.store www.iqthedltpshzqnbiegqlkh.store;

  ssl_certificate /etc/letsencrypt/live/iqthedltpshzqnbiegqlkh.store/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/iqthedltpshzqnbiegqlkh.store/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

  server_tokens         off;
  client_max_body_size  20m;

  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header X-Content-Type-Options    "nosniff"          always;
  add_header X-Frame-Options           "DENY"             always;
  add_header Referrer-Policy           "no-referrer"      always;

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # oauth relay pages
  location ^~ /oauth/ {
    # allow GET/HEAD for oauth relay pages
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    add_header Cache-Control "no-store" always;
    add_header Pragma        "no-cache" always;

    # tight csp for a relay page (allows inline script for postMessage + close)
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; style-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # mute coop warnings for oauth popup flows
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    proxy_http_version 1.1;
    proxy_pass http://nginx9000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy             "";

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # proxy_set_header Connection "";

    # send internal auth token
    proxy_set_header Internal-Auth $internal_auth_token;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_buffering off;
  }

  # main api entrypoint
  location ^~ /api/ {
    proxy_http_version 1.1;
    proxy_pass http://nginx9000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Proxy             "";

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # proxy_set_header Connection "";

    # send internal auth token
    proxy_set_header Internal-Auth $internal_auth_token;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_buffering off;
  }

  # (optional) deny other
  location / {
    return 404;
  }
}

server {
  listen 80;
  server_name iqthedltpshzqnbiegqlkh.store www.iqthedltpshzqnbiegqlkh.store;
  return 301 https://$host$request_uri; # managed by Certbot
}
